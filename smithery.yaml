startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      serp_api_key:
        type: string
        description: "SerpApi key for Google Flights searches"
    required: ["serp_api_key"]
    additionalProperties: false
  commandFunction: |
    function generateCommand(config) {
      return { command: "mcp-flight-search", args: [], env: { SERP_API_KEY: config.serp_api_key } };
    }
